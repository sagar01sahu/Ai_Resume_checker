databases:
  - name: resumerank-db
    databaseName: resume_ranker
    user: resume_ranker
    plan: free

services:
  - type: web
    name: resumerank-app
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resumerank-db
          property: connectionString
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: HF_HOME
        value: /app/.cache/huggingface
      - key: TRANSFORMERS_OFFLINE
        value: "1"
      - key: HF_HUB_OFFLINE
        value: "1"
